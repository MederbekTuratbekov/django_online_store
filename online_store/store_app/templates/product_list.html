<ul>
    {% for product in products %}
    <li>
        <p><a href="{% url 'product_detail_url' product.pk %}">Название: {{ product.product_name }}</a></p>
        <p>Категория: {{ product.category }} </p>
        <p>Цена: {{ product.price }} </p>
        <p>Год выпуска: {{ product.created_date }} </p><br>
    </li>
    {% endfor %}
</ul>
<button><a href="{% url 'product_create_url' %}">Create</a></button>
